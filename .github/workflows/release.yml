name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # The tagged commit must pass the same checks as a pull request before anything is built,
  # signed or published.
  test:
    name: Test before release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Build
        run: go build ./...
      - name: Tests
        run: go test -race -timeout 30m ./...
      - name: Docs are current
        run: |
          go generate ./...
          git diff --exit-code -- docs/ || { echo "::error::docs/ is stale; run 'make docs' and commit it"; exit 1; }
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  goreleaser:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Import GPG key
        id: import_gpg
        # Pinned to a commit: this action handles the signing key.
        uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6.3.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
